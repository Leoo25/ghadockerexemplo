name: Geração e publicação de imagem Docker

on:
  push:
    branches: [ "main", "b1" ]
    tags: [ 'v*.*.*' ]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    
    steps:
      # Instalação do codigo-fonte
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configuração do Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Instalação das dependências
      - name: Install dependencies
        run: npm ci

      # AUDITORIA DE SEGURANÇA
      - name: Security Audit
        run: npm audit --audit-level=high # Falha se houver vulnerabilidades graves

      # ANÁLISE ESTÁTICA (LINT)
      - name: Run Lint
        run: npm run lint

      # TESTES DE FUNÇÃO E COBERTURA
      - name: Run Functional Tests
        run: npm run test:coverage

  build-and-push:
    runs-on: ubuntu-latest
    needs: qualidade
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configura o ambiente Docker Buildx para cache e builds otimizados
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login no Docker Hub usando Secrets
      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Extrai metadados (Tags e Labels) automaticamente
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ vars.IMG_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            latest

      # Build e Push definitivo
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max